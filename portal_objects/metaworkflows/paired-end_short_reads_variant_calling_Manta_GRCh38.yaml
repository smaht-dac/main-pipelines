## Pipeline information #####################################
#     General information for the pipeline
#############################################################
name: paired-end_short_reads_variant_calling_Manta_GRCh38
description: Run Manta on short-read data for structural variant calling in tumor-only mode. |
             Accepts a list of CRAM files as input; when more than one is provided they are |
             merged internally by the Manta workflow before calling. |
             Produces scored (tumorSV) and unscored candidate (candidateSV) calls in VCF format. |

category:
  - Variant Calling

## General arguments ########################################
#     Pipeline input, reference files, and general arguments
#       define all arguments for the pipeline here
#############################################################
input:

  # File inputs
  input_files_cram:
    argument_type: file.cram
    dimensionality: 1

  genome_reference_fasta:
    argument_type: file.fa
    files:
      - complete-reference-fasta-no-alt@GCA_000001405.15_GRCh38_no_decoy

## Workflows and dependencies ###############################
#     Information for the workflows and their dependencies
#############################################################
workflows:

  ## Workflow definition #####################
  #  manta
  #    Merges the input CRAMs internally (when more than one) and
  #    runs Manta in tumor-only mode
  ############################################
  manta:

    ## Specific arguments ##############
    ####################################
    input:

      # File arguments
      input_files_cram:
        argument_type: file.cram
        mount: True

      genome_reference_fasta:
        argument_type: file.fa

      # Parameter arguments
      nthreads:
        argument_type: parameter.integer
        value: 8

    ## Output ##############################
    #     Output files for the workflow
    ########################################
    output:

      # File outputs
      output_file_vcf_gz:
        description: Manta structural variant VCF (scored)
        data_category:
          - Germline Variant Calls
          - Somatic Variant Calls
        data_type:
          - SV
        output_status: Final Output
        # These fields are required to link metadata for the naming
        software:
          - smaht:Software-Manta_1.6.0
        reference_genome: GRCh38

      output_file_candidate_vcf_gz:
        description: Manta unscored candidate structural variant VCF
        data_category:
          - Germline Variant Calls
          - Somatic Variant Calls
        data_type:
          - SV
        output_status: Final Output
        # These fields are required to link metadata for the naming
        software:
          - smaht:Software-Manta_1.6.0
        reference_genome: GRCh38

    ## EC2 Configuration to use ########
    ####################################
    config:
      instance_type: # 64 GiB, 8 cores
        - r5a.2xlarge
        - r6a.2xlarge
        - r6i.2xlarge
        - r7i.2xlarge
        - r8i.2xlarge
      ebs_size: "2x"
      ebs_optimized: True
      spot_instance: False
      run_name: run_manta
      behavior_on_capacity_limit: wait_and_retry
